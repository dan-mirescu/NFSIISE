plugins {
    id 'com.android.application'
}

android {
    namespace = "org.zaps166.NFSIISE"
    compileSdk = 35
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId = "org.zaps166.NFSIISE"
        minSdk = 21
        targetSdk = 35
        versionCode = 1
        versionName = "1.4.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DSDL_STATIC=OFF"
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file('jni/CMakeLists.txt')
        }
    }

    sourceSets {
        main {
            // SDL3's Java glue (org.libsdl.app.*) comes straight from the SDL sources
            java.srcDirs += ['jni/SDL/android-project/app/src/main/java']
            jniLibs.srcDir 'libs'
        }
    }

    packaging {
        jniLibs {
            // libnfs2se.so is dlopen()ed by name from the loader stub, so the
            // native libraries have to be extracted to the filesystem
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
